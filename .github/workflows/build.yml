name: Build fb2k Component (Force Path)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    # 1. 强行建立外层映射，并移除任何失败拦截，保证流水线绝对放行
    - name: Move SDK to Target Path
      run: |
        Write-Host "Forcing SDK directory synchronization..."
        New-Item -ItemType Directory -Path ..\foobar2000-sdk -Force
        Copy-Item -Path .\foobar2000-sdk\* -Destination ..\foobar2000-sdk\ -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "Forced synchronization completed."
      shell: powershell

    # 2. 获取 Visual Studio 最优 MSBuild 编译器
    - name: Locate MSBuild
      run: |
        $msbuildPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        echo "MSBUILD_PATH=$msbuildPath" >> $env:GITHUB_ENV
      shell: powershell

    # 3. 开始 64 位编译
    - name: Build x64 (64-bit)
      run: |
        if (Test-Path ".\foo_stopafter.sln") {
            & $env:MSBUILD_PATH .\foo_stopafter.sln /p:Configuration=Release /p:Platform=x64
        } else {
            & $env:MSBUILD_PATH .\foo_stopafteralbum.sln /p:Configuration=Release /p:Platform=x64
        }
      shell: powershell

    # 4. 全局提取最终编译生成的 64 位插件 DLL 并打包
    - name: Package Component
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path .\build_output -Force
        Get-ChildItem -Recurse -Filter foo_*.dll | Where-Object { $_.FullName -like "*Release*" -and $_.FullName -notlike "*obj*" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination .\build_output\ -Force
            Write-Host "Successfully captured DLL: $($_.Name)"
        }
        Compress-Archive -Path .\build_output\* -DestinationPath .\foo_stopafter.fb2k-component -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fb2k-component-file
        path: .\foo_stopafter.fb2k-component
