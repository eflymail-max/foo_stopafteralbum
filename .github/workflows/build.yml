name: Build foobar2000 component

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone foobar2000 SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/a1waysbeta/foobar2000-sdk.git foobar2000-sdk

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: |
          $msbuild = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            $msbuild = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
          }
          if (-not (Test-Path $msbuild)) {
            throw "MSBuild.exe not found. Visual Studio Build Tools may not be installed on the runner."
          }

          & $msbuild "foo_stopafter.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_stopafter-x64
          path: |
            x64/Release/foo_stopafter.dll
            x64/Release/foo_stopafter.pdb
