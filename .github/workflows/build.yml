name: Build fb2k Component

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 在全局加入环境变量，允许在当前的 Node24 环境下平稳运行
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    - name: Locate MSBuild
      run: |
        $msbuildPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        echo "MSBUILD_PATH=$msbuildPath" >> $env:GITHUB_ENV
      shell: powershell

    - name: Build x86 (32-bit)
      run: |
        & $env:MSBUILD_PATH foo_stopafter.sln /p:Configuration=Release /p:Platform=x86
      shell: powershell

    - name: Build x64 (64-bit)
      run: |
        & $env:MSBUILD_PATH foo_stopafter.sln /p:Configuration=Release /p:Platform=x64
      shell: powershell

    - name: Package Component
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path .\build_output -Force
        Copy-Item -Path ".\Release\foo_*.dll" -Destination .\build_output\ -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path .\build_output\x64 -Force
        Copy-Item -Path ".\x64\Release\foo_*.dll" -Destination .\build_output\x64\ -ErrorAction SilentlyContinue
        Compress-Archive -Path .\build_output\* -DestinationPath .\my_plugin.fb2k-component -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fb2k-component-file
        path: .\my_plugin.fb2k-component
