name: Build foobar2000 component

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean stale build outputs
        shell: pwsh
        run: |
          $paths = @("x64", "Debug", "Release", ".vs", "foo_stopafter\x64", "foo_stopafter\Debug", "foo_stopafter\Release")
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Remove-Item $p -Recurse -Force
            }
          }

      - name: Remove old SDK if exists
        shell: bash
        run: |
          if [ -d ../foobar2000-sdk ]; then
            rm -rf ../foobar2000-sdk
          fi

      - name: Clone SDK alongside the repo
        shell: bash
        run: |
          git clone --depth 1 https://github.com/a1waysbeta/foobar2000-sdk.git ../foobar2000-sdk

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found."
          }

          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw "Visual Studio with MSBuild not found."
          }

          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"

          if (-not (Test-Path $msbuild)) {
            throw "MSBuild.exe not found under $installPath"
          }

          & $msbuild "foo_stopafteralbum.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_stopafter-x64
          path: |
            x64/Release/foo_stopafter.dll
            x64/Release/foo_stopafter.pdb
