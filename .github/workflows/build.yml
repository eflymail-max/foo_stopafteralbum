name: Build foobar2000 component

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clean stale build output
        shell: pwsh
        run: |
          $paths = @(
            "x64",
            "Debug",
            "Release",
            "foo_stopafter\x64",
            "foo_stopafteralbum\x64"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Remove-Item $p -Recurse -Force
            }
          }

      - name: Ensure foobar2000 SDK exists
        shell: pwsh
        run: |
          if (-not (Test-Path "foobar2000-sdk")) {
            git clone --depth 1 https://github.com/a1waysbeta/foobar2000-sdk.git foobar2000-sdk
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build solution
        shell: pwsh
        run: |
          msbuild "foo_stopafter.sln" `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_stopafter-x64
          path: |
            x64/Release/foo_stopafter.dll
            x64/Release/foo_stopafter.pdb
