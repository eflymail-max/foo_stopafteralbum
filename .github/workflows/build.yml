name: Build fb2k Component (Symlink Forced)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    # Use cmd native rmdir to completely destroy any locked or blocking folders
    - name: Create Workspace Symlinks
      run: |
        Write-Host "Forcing destruction of conflicting directories..."
        cmd /c "rmdir /s /q D:\a\foo_stopafteralbum\foobar2000-sdk 2>nul"
        cmd /c "rmdir /s /q ..\foobar2000-sdk 2>nul"
        
        Write-Host "Injecting symlinks into workspace trees..."
        cmd /c "mklink /d D:\a\foo_stopafteralbum\foobar2000-sdk D:\a\foo_stopafteralbum\foo_stopafteralbum\foobar2000-sdk"
        cmd /c "mklink /d ..\foobar2000-sdk .\foobar2000-sdk"
        Write-Host "Symlinks injected successfully."
      shell: powershell

    - name: Locate MSBuild
      run: |
        $msbuildPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        echo "MSBUILD_PATH=$msbuildPath" >> $env:GITHUB_ENV
      shell: powershell

    - name: Build x64 (64-bit)
      run: |
        if (Test-Path ".\foo_stopafter.sln") {
            & $env:MSBUILD_PATH .\foo_stopafter.sln /p:Configuration=Release /p:Platform=x64
        } else {
            & $env:MSBUILD_PATH .\foo_stopafteralbum.sln /p:Configuration=Release /p:Platform=x64
        }
      shell: powershell

    - name: Package Component
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path .\build_output -Force
        Get-ChildItem -Recurse -Filter foo_*.dll | Where-Object { $_.FullName -like "*Release*" -and $_.FullName -notlike "*obj*" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination .\build_output\ -Force
        }
        Compress-Archive -Path .\build_output\* -DestinationPath .\foo_stopafter.fb2k-component -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fb2k-component-file
        path: .\foo_stopafter.fb2k-component
