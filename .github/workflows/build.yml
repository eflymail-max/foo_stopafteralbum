name: Build fb2k Component

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    # 【替换方案】不用 microsoft/setup-msbuild 插件，直接用命令行寻找当前系统自带的 MSBuild
    - name: Locate MSBuild
      run: |
        $msbuildPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        echo "MSBUILD_PATH=$msbuildPath" >> $env:GITHUB_ENV
      shell: powershell

    - name: Build x86 (32-bit)
      run: |
        & "${{ env:MSBUILD_PATH }}" your_solution.sln /p:Configuration=Release /p:Platform=x86
      shell: powershell

    - name: Build x64 (64-bit)
      run: |
        & "${{ env:MSBUILD_PATH }}" your_solution.sln /p:Configuration=Release /p:Platform=x64
      shell: powershell

    - name: Package Component
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path .\build_output
        Copy-Item -Path ".\Release\foo_*.dll" -Destination .\build_output\ -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path .\build_output\x64 -ErrorAction SilentlyContinue
        Copy-Item -Path ".\x64\Release\foo_*.dll" -Destination .\build_output\x64\ -ErrorAction SilentlyContinue
        Compress-Archive -Path .\build_output\* -DestinationPath .\my_plugin.fb2k-component -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fb2k-component-file
        path: .\my_plugin.fb2k-component
